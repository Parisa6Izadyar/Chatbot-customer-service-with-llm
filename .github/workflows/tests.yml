name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - review/llm-demo-fixes-20261029

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CHATBOT_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Evaluate demo routing
        run: python scripts/run_demo_evaluation.py
