services:
  ollama:
    image: ollama/ollama
    container_name: trustaware-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: trustaware-app
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b

volumes:
  ollama_data: